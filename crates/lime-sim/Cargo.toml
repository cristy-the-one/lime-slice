[package]
name = "lime-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "In-house linear static stress solver for Lime Slice"

[dependencies]
faer = { version = "=0.24.4", default-features = false, features = ["std", "sparse-linalg", "rayon"] }
pollster = { version = "0.4", optional = true }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "27", optional = true, default-features = false, features = ["wgsl", "dx12", "vulkan", "metal"] }

[features]
# The iterative check's smoothing on a GPU through wgpu. Off by default: it
# brings wgpu's tree, and a machine without an adapter solves on the CPU.
gpu = ["dep:wgpu", "dep:pollster"]

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "lime-sim"
path = "src/bin/lime-sim.rs"
