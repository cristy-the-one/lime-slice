[package]
name = "lime-sim-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Slices one object and runs a stress study on it as sliced, for the app and the MCP"

[dependencies]
base64 = "0.22"
lime-sim = { path = "../lime-sim" }
lime-slice-core = { path = "../lime-slice-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
gpu = ["lime-sim/gpu"]
