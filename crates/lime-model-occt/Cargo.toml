[package]
name = "lime-model-occt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Open CASCADE bridge for Model mode. The slicer does not link this crate."

[lib]
name = "lime_model_occt"
crate-type = ["rlib", "cdylib"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
lime-model-load = { path = "../lime-model-load" }
