[package]
name = "lime-model-occt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Open CASCADE bridge for Model mode. The slicer does not link this crate."

[lib]
name = "lime_model_occt"
crate-type = ["rlib", "cdylib"]

[dependencies]
base64 = "0.22"
# Glyph outlines from font files (docs/plan-text-on-curves-and-fonts.md D1). No dependencies, no unsafe code.
ttf-parser = "0.25"
# geom2d: a glyph that overlaps itself is united in 2D before it is built, and thin strokes are found by an opening.
lime-recipe = { path = "../lime-recipe" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
# The first triangulation of a flat face with many holes (src/flat_mesh.rs), with Shewchuk's adaptive exact predicates
# (`robust`). Both MIT OR Apache-2.0, and both already in the lock file through truck-meshalgo.
spade = "2.15"
robust = "1.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
lime-model-load = { path = "../lime-model-load" }
# The shaft test's oracle is `horology::shaft`, the same function the kernel calls.
lime-recipe = { path = "../lime-recipe" }
