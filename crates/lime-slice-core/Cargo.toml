[package]
name = "lime-slice-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "FDM mesh slicing core for Lime Slice"

[dependencies]
base64 = "0.22"
clipper2 = "0.6"
libm = "0.2"
quick-xml = "0.37"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
truck-meshalgo = { version = "0.4", default-features = false, features = ["tessellation"] }
truck-stepio = { version = "0.3", default-features = false, features = ["in", "derive"] }
truck-topology = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
earcutr = "0.4"
serde_json.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
