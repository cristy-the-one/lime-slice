[package]
name = "lime-recipe"
version.workspace = true
# Recipes build with lust (edition 2024 only) as well as with rustc, so this
# crate states its own edition instead of inheriting the workspace's 2021.
edition = "2024"
license = "MIT"
publish = false
description = "The recipe side of Lime Slice's recipe protocol (docs/plan-recipes.md): no dependencies, built by lust and by rustc."

[dependencies]

[dev-dependencies]
# The kernel, as the reference for geom2d booleans in tests only (tests/kernel_reference.rs). Recipes never link it.
lime-model-occt = { path = "../lime-model-occt" }
