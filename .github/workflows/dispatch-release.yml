# One-shot: the cloud agent token cannot call workflow_dispatch. This
# push-triggered job uses the repository Actions token to start release.yml
# on main. It is not part of the product and should not be merged.
name: Dispatch release
on:
  push:
    branches:
      - cursor/dispatch-release-46aa
jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch release.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/cristy-the-one/lime-slice/actions/workflows/release.yml/dispatches -f ref=main
          echo "dispatched release.yml on main"
