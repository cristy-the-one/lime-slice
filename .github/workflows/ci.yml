name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # A change to docs/ or Markdown alone builds and tests nothing. Every other job
  # needs this one and is skipped then; a skipped required check counts as passed.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      macos: ${{ steps.diff.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "macos=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          # The macOS jobs run only when something that can behave differently on macOS changed: native code,
          # the build, the engine's loading, or CI itself. macOS runners are scarce, and queued macOS jobs were
          # cancelled with no runner several times on 2026-11-02 while TypeScript-only PRs waited on them.
          macos=false
          while IFS= read -r file; do
            case "$file" in
              docs/*|*.md|"") ;;
              *) code=true ;;
            esac
            case "$file" in
              crates/*|src-tauri/*|Cargo.toml|Cargo.lock|rust-toolchain*|.cargo/*|tools/occt/*|tools/mcp/*|mcp/native*|mcp/engine*|package-lock.json|.github/workflows/ci.yml) macos=true ;;
            esac
          done < <(git diff --name-only "$BASE...$HEAD")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code, macOS-relevant: $macos"

  rust:
    name: test, clippy, and Tauri
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      LIME_REQUIRE_OCCT: "1"
    steps:
      - uses: actions/checkout@v7

      # The debug build of the whole workspace, its tests, OCCT and lust fill the runner's disk: the Test step
      # stopped on "No space left on device" three times on 2026-11-01. These preinstalled SDKs are not used here.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h / | tail -1

      # runner.temp is not available in a job-level env block.
      - name: Point at the OCCT install
        run: |
          echo "OCCT_ROOT=${{ runner.temp }}/occt-7.9.2" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${{ runner.temp }}/occt-7.9.2/lib" >> "$GITHUB_ENV"

      # The packages download in about 30 s, but a crawling mirror has taken
      # 29 minutes and a silent one over an hour. The downloaded packages are
      # cached, so a slow mirror costs one run, and apt gives up on a silent
      # one. The step fails at 40 minutes rather than holding the job for hours.
      - name: Restore the downloaded GTK packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-gtk-${{ runner.os }}-noble-v1

      - name: Install GTK and WebKitGTK
        timeout-minutes: 40
        run: |
          { echo 'Acquire::http::Timeout "30";'; echo 'Acquire::https::Timeout "30";'; echo 'Acquire::Retries "3";'; } | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" \
            build-essential \
            pkg-config \
            libssl-dev \
            patchelf \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            cmake \
            ninja-build
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$USER" ~/apt-archives

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Restore the OCCT shared libraries
        id: occt-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Build OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 180
        run: python3 tools/occt/install.py --prefix "$OCCT_ROOT"

      - name: Save the OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Test
        run: |
          cargo build -p lime-model-occt --locked
          export LIME_OCCT_BRIDGE="$PWD/target/debug/liblime_model_occt.so"
          cargo test --workspace --locked

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # recipe_run checks and compiles recipes with lust, pinned in tools/lust/LUST_REV. Linux and
      # Windows only: lust does not build on macOS yet, so mcp-macos skips these steps (see there).
      - name: Cache lust
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/lust
          key: lust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/lust/LUST_REV', 'tools/lust/install.sh') }}

      - name: Build lust
        timeout-minutes: 20
        run: echo "LIME_LUST=$(tools/lust/install.sh "$RUNNER_TEMP/lust")" >> "$GITHUB_ENV"

      # The app's recipe runner with a real recipe built by lust (the workspace test above skipped it without lust).
      - name: Recipe runner with lust
        timeout-minutes: 10
        env:
          LIME_RECIPE_REQUIRED: "1"
        run: cargo test -p lime-recipe-runner --locked

      - name: MCP server against real Open CASCADE
        timeout-minutes: 25
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo build -p lime-mcp-engine -p lime-model-occt --locked
          export LIME_OCCT_BRIDGE="$PWD/target/debug/liblime_model_occt.so"
          export LD_LIBRARY_PATH="${OCCT_ROOT}/lib:${LD_LIBRARY_PATH:-}"
          node --experimental-strip-types mcp/occt.test.ts
          node --experimental-strip-types mcp/vars-drive.test.ts
          node --experimental-strip-types mcp/step-solids.test.ts
          node --experimental-strip-types mcp/split-shells-brep.test.ts
          node --experimental-strip-types mcp/kernel-gaps.test.ts
          node --experimental-strip-types mcp/assemblies-m1.test.ts
          node --experimental-strip-types mcp/assemblies-m3.test.ts
          node --experimental-strip-types mcp/assembly.test.ts
          node --experimental-strip-types mcp/interference-exact.test.ts
          node --experimental-strip-types mcp/assembly-export.test.ts
          node --experimental-strip-types mcp/assembly-part-frame.test.ts
          # A Model edit between two sliced solves needs OCCT, so the sim region test runs here, not in the mcp job.
          node --experimental-strip-types mcp/sim-region.test.ts
          # recipe_run end to end: lust builds, OCCT cuts, a failed or dry run is taken back.
          LIME_RECIPE_REQUIRED=1 node --experimental-strip-types mcp/recipe-session.test.ts
          # Recipes read real geometry (section, face frames) and build lattices in one boolean, the honeycomb floor too.
          LIME_RECIPE_REQUIRED=1 node --experimental-strip-types mcp/recipe-reads.test.ts
          # Plugin steps on real OCCT: a rebuild with the later steps replayed, save and reopen, the same fingerprint.
          LIME_RECIPE_REQUIRED=1 node --experimental-strip-types mcp/plugin-step.test.ts
          # The app's rebuild of a plugin step against the MCP's on real OCCT: the same stamp, steps and solid.
          LIME_RECIPE_REQUIRED=1 node --experimental-strip-types mcp/plugin-app.test.ts
          # Recipe API 1.2 on real OCCT: a picked face found again after an earlier step moved it, outlines, refuse.
          LIME_RECIPE_REQUIRED=1 node --experimental-strip-types mcp/plugin-picks.test.ts

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The engine and the app turn on the stress solver's GPU smoothing, so the
      # workspace's clippy lints it. Its tests run here with it; with no adapter
      # on the runner, the GPU test says it was skipped and the CPU path runs.
      - name: Stress solver with the gpu feature
        run: cargo test -p lime-sim --features gpu --locked --test sliced_study

      - name: Build the Tauri crate
        run: cargo build -p lime-slice-desktop --locked

  ui:
    name: typecheck and frontend build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Frontend build
        run: npx vite build

  # The e2e specs split over four runners. Every shard builds the frontend
  # itself because `vite preview` serves dist/.
  smoke:
    name: Playwright smoke (shard ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend build
        run: npx vite build

      - name: Playwright browser version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        # A stuck apt mirror once held this step for over an hour, and on
        # 2026-10-22 a crawling one ran out two five-minute tries. apt now gives
        # up on a silent mirror itself. The system packages are fonts and
        # upgrades the runner image can do without, so when they don't arrive
        # in ten minutes the browser goes in alone. A killed install leaves its
        # apt-get running as root with the dpkg lock, so that is stopped first.
        timeout-minutes: 18
        run: |
          { echo 'Acquire::http::Timeout "30";'; echo 'Acquire::https::Timeout "30";'; echo 'Acquire::Retries "3";'; } | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          timeout 600 npx playwright install --with-deps chromium && exit 0
          echo "The system packages did not install; installing the browser without them"
          sudo pkill -x apt-get || true
          sudo pkill -x dpkg || true
          sleep 2
          sudo dpkg --configure -a || true
          timeout 300 npx playwright install chromium

      # test:smoke leaves out the @perf specs, which run in perf.yml.
      - name: Playwright smoke
        run: npm run test:smoke -- --shard=${{ matrix.shard }}/4

  mcp:
    name: MCP server
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The runner image already has these, so apt runs only when one is
      # missing. A stuck mirror held this step for over an hour on 2026-10-23.
      - name: Install the C++ toolchain Clipper2 links against
        timeout-minutes: 10
        run: |
          command -v gcc g++ make pkg-config > /dev/null && exit 0
          { echo 'Acquire::http::Timeout "30";'; echo 'Acquire::https::Timeout "30";'; echo 'Acquire::Retries "3";'; } | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release CLI and in-process engine
        # lime-sim's binary solves the generated beam in mcp/sim.test.ts.
        run: cargo build -p lime-slice -p lime-mcp-engine -p lime-sim --release --locked

      - name: New engine dependencies stay MIT or Apache-2.0
        run: |
          set -euo pipefail
          cargo tree -p lime-mcp-engine --prefix none -e normal --format '{p} {l}' > /tmp/mcp-licences.txt
          if grep -Ei 'GPL|AGPL|SSPL' /tmp/mcp-licences.txt; then
            echo "a GPL-family licence is not allowed"
            exit 1
          fi
          cargo tree -p lime-sim --locked --prefix none -e normal --format '{p} {l}' > /tmp/sim-licences.txt
          if grep -Ei 'GPL|AGPL|SSPL|LGPL' /tmp/sim-licences.txt; then
            echo "a GPL-family licence is not allowed on the stress solver"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # recipe_run checks and compiles recipes with lust, pinned in tools/lust/LUST_REV. Linux and
      # Windows only: lust does not build on macOS yet, so mcp-macos skips these steps (see there).
      - name: Cache lust
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/lust
          key: lust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/lust/LUST_REV', 'tools/lust/install.sh') }}

      - name: Build lust
        timeout-minutes: 20
        run: echo "LIME_LUST=$(tools/lust/install.sh "$RUNNER_TEMP/lust")" >> "$GITHUB_ENV"

      - name: Typecheck the server
        run: npx tsc -p mcp

      - name: Schema, scenarios, export, and golden G-code
        run: |
          node --experimental-strip-types mcp/schema.test.ts
          node --experimental-strip-types mcp/scenario.test.ts
          node --experimental-strip-types mcp/model.test.ts
          node --experimental-strip-types mcp/partition.test.ts
          node --experimental-strip-types mcp/plan.test.ts
          node --experimental-strip-types mcp/request.test.ts
          node --experimental-strip-types mcp/numbers.test.ts
          node --experimental-strip-types mcp/render.test.ts
          node --experimental-strip-types mcp/layer-stress.test.ts
          node --experimental-strip-types mcp/sim.test.ts
          node --experimental-strip-types mcp/sim-sliced.test.ts
          node --experimental-strip-types mcp/sim-paint.test.ts
          node --experimental-strip-types mcp/pattern-slice.test.ts
          node --experimental-strip-types mcp/sim-reslice.test.ts
          node --experimental-strip-types mcp/sim-loop.test.ts
          node --experimental-strip-types mcp/thumb.test.ts
          node --experimental-strip-types mcp/export.test.ts
          LIME_MCP_GOLDEN=1 node --experimental-strip-types mcp/golden.test.ts
          node --experimental-strip-types mcp/native-load.test.ts
          node --experimental-strip-types mcp/stdio.test.ts
          # The installer's bundle: plain JavaScript with the engine beside it, as an install lays it out.
          npm run build:mcp
          cp target/release/liblime_mcp_engine.so src-tauri/resources/mcp/
          LIME_MCP_SERVER=src-tauri/resources/mcp/server.mjs node --experimental-strip-types mcp/stdio.test.ts
          node --experimental-strip-types mcp/part-a.test.ts
          node --experimental-strip-types mcp/batch1.test.ts
          node --experimental-strip-types mcp/batch2.test.ts
          node --experimental-strip-types mcp/slice-scope.test.ts
          node --experimental-strip-types src/paint-region.test.ts
          node --experimental-strip-types mcp/batch3.test.ts
          node --experimental-strip-types mcp/batch4.test.ts
          LIME_RECIPE_REQUIRED=1 node --experimental-strip-types mcp/recipe-floatmath.test.ts
          LIME_RECIPE_REQUIRED=1 node --experimental-strip-types mcp/recipe.test.ts
          LIME_RECIPE_REQUIRED=1 node --experimental-strip-types mcp/recipe-geom2d.test.ts
          LIME_RECIPE_REQUIRED=1 node --experimental-strip-types mcp/plugin.test.ts
          LIME_RECIPE_REQUIRED=1 node --experimental-strip-types mcp/plugin-step.test.ts
          LIME_RECIPE_REQUIRED=1 node --experimental-strip-types mcp/plugin-app.test.ts
          LIME_RECIPE_REQUIRED=1 node --experimental-strip-types mcp/plugin-picks.test.ts
          LIME_RECIPE_REQUIRED=1 node --experimental-strip-types mcp/plugin-share.test.ts
          LIME_RECIPE_REQUIRED=1 node --experimental-strip-types mcp/ingredient.test.ts
          LIME_RECIPE_REQUIRED=1 node --experimental-strip-types mcp/nugget.test.ts

  mcp-windows:
    name: MCP server (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release in-process engine
        run: cargo build -p lime-mcp-engine --release --locked

      - name: Explorer thumbnail handler
        run: |
          cargo test -p lime-preview --locked
          cargo test -p lime-shell --locked
          cargo build -p lime-shell --release --locked
          cargo build -p lime-shell --release --locked --example self-test

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Cache lust
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/lust
          key: lust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/lust/LUST_REV', 'tools/lust/install.sh') }}

      # tcc is built with cl, so the Visual Studio developer shell is loaded first, as lust's own CI does.
      - name: Build lust
        timeout-minutes: 25
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $lust = bash tools/lust/install.sh "$env:RUNNER_TEMP/lust" | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw "tools/lust/install.sh failed" }
          Add-Content -Path $env:GITHUB_ENV -Value "LIME_LUST=$lust"

      # A recipe's own sin, cos, exp, ln...: the same bits under lust and rustc (the UCRT's, on Windows).
      - name: Recipe float maths, lust against rustc
        timeout-minutes: 10
        env:
          LIME_RECIPE_REQUIRED: "1"
        run: node --experimental-strip-types mcp/recipe-floatmath.test.ts

      - name: Recipes
        timeout-minutes: 10
        env:
          LIME_RECIPE_REQUIRED: "1"
        run: node --experimental-strip-types mcp/recipe.test.ts

      # The app's recipe runner on Windows: the job object's memory cap and kill, and a real recipe built by lust.
      - name: Recipe runner
        timeout-minutes: 15
        env:
          LIME_RECIPE_REQUIRED: "1"
        run: cargo test -p lime-recipe-runner --locked

      # The same calls under lust and rustc for the crate's geometry: their libm differ here in the last bit.
      - name: Recipe geometry, lust against rustc
        timeout-minutes: 10
        env:
          LIME_RECIPE_REQUIRED: "1"
        run: node --experimental-strip-types mcp/recipe-geom2d.test.ts

      # Plugins: keep a recipe, find it, run it by id, versions, describe mode, own parts only.
      - name: Recipe plugins
        timeout-minutes: 10
        env:
          LIME_RECIPE_REQUIRED: "1"
        run: node --experimental-strip-types mcp/plugin.test.ts

      # Plugin steps: stamped runs, the project's own copy, a rebuild as one undo step (stand-in engine).
      - name: Recipe plugin steps
        timeout-minutes: 10
        env:
          LIME_RECIPE_REQUIRED: "1"
        run: node --experimental-strip-types mcp/plugin-step.test.ts

      # The app's rebuild of a plugin step against the MCP's: the same stamp, steps and solid (stand-in engine).
      - name: Plugin steps rebuilt by the app
        timeout-minutes: 10
        env:
          LIME_RECIPE_REQUIRED: "1"
        run: node --experimental-strip-types mcp/plugin-app.test.ts

      # Sharing: export one file, import it into another library (same hash, same solid), clashes, the fixtures' refusals.
      - name: Plugin sharing
        timeout-minutes: 10
        env:
          LIME_RECIPE_REQUIRED: "1"
        run: node --experimental-strip-types mcp/plugin-share.test.ts

      # Ingredients: imported by name, the same calls under lust and rustc, carried inside a kept plugin.
      - name: Recipe ingredients
        timeout-minutes: 10
        env:
          LIME_RECIPE_REQUIRED: "1"
        run: node --experimental-strip-types mcp/ingredient.test.ts

      # Nuggets: harvest offers, keeping an ingredient, presets, lessons, one find over every kind.
      - name: Recipe nuggets
        timeout-minutes: 10
        env:
          LIME_RECIPE_REQUIRED: "1"
        run: node --experimental-strip-types mcp/nugget.test.ts

  mcp-macos:
    name: MCP server (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release in-process engine
        run: cargo build -p lime-mcp-engine --release --locked

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Load the addon and run the scenarios
        run: |
          node --experimental-strip-types mcp/native-load.test.ts
          node --experimental-strip-types mcp/scenario.test.ts
          node --experimental-strip-types mcp/stdio.test.ts

      # Skipped until lust builds on macOS (tcc Mach-O; lust's own macOS job is off too). recipe_run answers
      # "Recipes need lust" here. To turn it back on, delete `if: false` and give this job the Cache lust and
      # Build lust steps of the mcp job.
      - name: Recipes
        if: false
        env:
          LIME_RECIPE_REQUIRED: "1"
        run: node --experimental-strip-types mcp/recipe.test.ts

  bench:
    name: release bench smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The Model specs in test:engine need the OCCT bridge. runner.temp is not
      # available in a job-level env block.
      - name: Point at the OCCT install
        run: echo "OCCT_LIBS=${{ runner.temp }}/occt-7.9.2" >> "$GITHUB_ENV"

      # CMake and Ninja build OCCT when the cache misses. The runner image
      # already has the toolchain, so apt runs only when one is missing.
      - name: Install the C++ toolchain Clipper2 links against
        timeout-minutes: 10
        run: |
          command -v gcc g++ make pkg-config cmake ninja > /dev/null && exit 0
          { echo 'Acquire::http::Timeout "30";'; echo 'Acquire::https::Timeout "30";'; echo 'Acquire::Retries "3";'; } | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake ninja-build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release CLI
        run: cargo build -p lime-slice --release --locked

      # The estimate a Klipper slice writes against the Klipper model that matches real prints.
      - name: Print-time estimate matches klipper_time.py
        run: bash tools/estimate_check.sh target/release/lime-slice

      # Same cache as the rust job. A miss builds OCCT here too.
      - name: Restore the OCCT shared libraries
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Build OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 180
        run: python3 tools/occt/install.py --prefix "$OCCT_LIBS"

      - name: Save the OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      # OCCT_ROOT only for this step, so the CLI above stays the plain build.
      # The bridge lands in target/release next to lime-slice, where the engine looks.
      - name: Release OCCT bridge
        env:
          OCCT_ROOT: ${{ env.OCCT_LIBS }}
        run: |
          cargo build -p lime-model-occt --release --locked
          test -f target/release/liblime_model_occt.so

      - name: Slice bundled samples and the PA tower
        run: |
          set -euo pipefail
          mkdir -p bench-out
          bin="target/release/lime-slice"
          {
            echo "lime-slice $(git rev-parse --short HEAD)"
            for sample in samples/*; do
              if [[ "$(basename "$sample")" == "dragon_2_5.stl" ]]; then
                echo "skip ${sample}: checked-in mesh, Dragon audit is opt-in"
                continue
              fi
              echo
              echo "===== bench ${sample} ====="
              "${bin}" bench "${sample}"
            done
            echo
            echo "===== calibrate pa ====="
            "${bin}" calibrate pa -o bench-out/pa-klipper.gcode
            "${bin}" calibrate pa --firmware marlin -o bench-out/pa-marlin.gcode
          } | tee bench-out/bench.txt
          test -s bench-out/bench.txt
          test -s bench-out/pa-klipper.gcode
          test -s bench-out/pa-marlin.gcode

      - name: Upload bench output
        uses: actions/upload-artifact@v7
        with:
          name: bench-smoke
          path: bench-out/
          if-no-files-found: error

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Playwright browser version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        # A stuck apt mirror once held this step for over an hour, and on
        # 2026-10-22 a crawling one ran out two five-minute tries. apt now gives
        # up on a silent mirror itself. The system packages are fonts and
        # upgrades the runner image can do without, so when they don't arrive
        # in ten minutes the browser goes in alone. A killed install leaves its
        # apt-get running as root with the dpkg lock, so that is stopped first.
        timeout-minutes: 18
        run: |
          { echo 'Acquire::http::Timeout "30";'; echo 'Acquire::https::Timeout "30";'; echo 'Acquire::Retries "3";'; } | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          timeout 600 npx playwright install --with-deps chromium && exit 0
          echo "The system packages did not install; installing the browser without them"
          sudo pkill -x apt-get || true
          sudo pkill -x dpkg || true
          sleep 2
          sudo dpkg --configure -a || true
          timeout 300 npx playwright install chromium

      - name: Frontend build
        run: npx vite build

      - name: Playwright against the release engine
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="${OCCT_LIBS}/lib:${LD_LIBRARY_PATH:-}"
          target/release/lime-slice serve --port 43218 --cache-dir "$RUNNER_TEMP/slicecache" &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:43218/api/health && break; sleep 1; done
          # The Model specs skip on an engine without a modeler. Fail here instead.
          probe=$(curl -sf http://127.0.0.1:43218/api/model/tree -H 'content-type: application/json' -d '{"call":"open","key":"ci-probe","primitive":{"primitive":"box","origin":[0,0,0],"size":[1,1,1],"turn":[0,0,0]},"chordMm":0.1}')
          echo "${probe:0:300}"
          [[ "$probe" == *'"volumeMm3"'* ]]
          curl -sf http://127.0.0.1:43218/api/model/tree -H 'content-type: application/json' -d '{"call":"close","key":"ci-probe"}' > /dev/null
          LIME_EDIT_API=http://127.0.0.1:43218 npm run test:engine

  occt-windows:
    name: OCCT dynamic link (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      LIME_REQUIRE_OCCT: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Point at the OCCT install
        run: Add-Content -Path $env:GITHUB_ENV -Value "OCCT_ROOT=${{ runner.temp }}\occt-7.9.2"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Restore the OCCT shared libraries
        id: occt-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Build OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 300
        run: python tools/occt/install.py --prefix "$env:OCCT_ROOT"

      - name: Save the OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Test the dynamic link
        run: |
          $env:PATH = "$env:OCCT_ROOT\bin;$env:OCCT_ROOT\lib;" + $env:PATH
          cargo test -p lime-model -p lime-model-occt --locked -- --nocapture

      # The step above puts the Open CASCADE DLLs on PATH, which is why a
      # LoadLibrary that ignores the bridge's own folder still passed. This
      # step must not add that folder to PATH. The test copies the install
      # layout and strips PATH itself before loading.
      - name: Load the bridge from the bundled layout without PATH
        run: |
          cargo build -p lime-model-occt --locked
          $root = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { Join-Path $PWD "target" }
          $dll = $null
          foreach ($rel in @("debug\lime_model_occt.dll", "debug\deps\lime_model_occt.dll")) {
            $candidate = Join-Path $root $rel
            if (Test-Path -LiteralPath $candidate) { $dll = $candidate; break }
          }
          if (-not $dll) { throw "bridge dll missing under $root" }
          $env:LIME_OCCT_BRIDGE_DLL = (Resolve-Path -LiteralPath $dll).Path
          cargo test -p lime-model-load --test bundled_layout --locked -- --nocapture

      - name: STEP import regression through the loaded bridge
        run: |
          $bundle = Join-Path $PWD "target/step-occt"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item -LiteralPath "target/debug/lime_model_occt.dll" -Destination (Join-Path $bundle "lime_model_occt.dll")
          Get-ChildItem "$env:OCCT_ROOT/bin/*.dll", "$env:OCCT_ROOT/lib/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $bundle
          $env:LIME_OCCT_BRIDGE = Join-Path $bundle "lime_model_occt.dll"
          cargo test -p lime-model-load --test step_import --locked -- --nocapture

  occt-macos:
    name: OCCT dynamic link (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      LIME_REQUIRE_OCCT: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Point at the OCCT install
        run: |
          echo "OCCT_ROOT=${{ runner.temp }}/occt-7.9.2" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=${{ runner.temp }}/occt-7.9.2/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install CMake
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          cmake --version

      - name: Restore the OCCT shared libraries
        id: occt-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Build OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 300
        run: python3 tools/occt/install.py --prefix "$OCCT_ROOT"

      - name: Save the OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Test the dynamic link
        run: cargo test -p lime-model -p lime-model-occt --locked -- --nocapture
