name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: test, clippy, and Tauri
    runs-on: ubuntu-24.04
    env:
      LIME_REQUIRE_OCCT: "1"
    steps:
      - uses: actions/checkout@v7

      # runner.temp is not available in a job-level env block.
      - name: Point at the OCCT install
        run: |
          echo "OCCT_ROOT=${{ runner.temp }}/occt-7.9.2" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${{ runner.temp }}/occt-7.9.2/lib" >> "$GITHUB_ENV"

      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            patchelf \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            cmake \
            ninja-build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Restore the OCCT shared libraries
        id: occt-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Build OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 180
        run: python3 tools/occt/install.py --prefix "$OCCT_ROOT"

      - name: Save the OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Test
        run: |
          cargo build -p lime-model-occt --locked
          export LIME_OCCT_BRIDGE="$PWD/target/debug/liblime_model_occt.so"
          cargo test --workspace --locked

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: MCP server against real Open CASCADE
        timeout-minutes: 25
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo build -p lime-mcp-engine -p lime-model-occt --locked
          export LIME_OCCT_BRIDGE="$PWD/target/debug/liblime_model_occt.so"
          export LD_LIBRARY_PATH="${OCCT_ROOT}/lib:${LD_LIBRARY_PATH:-}"
          node --experimental-strip-types mcp/occt.test.ts

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build the Tauri crate
        run: cargo build -p lime-slice-desktop --locked

  ui:
    name: typecheck and frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Frontend build
        run: npx vite build

      - name: Playwright browser version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        # A stuck apt mirror once held this step for over an hour. Each try
        # gets five minutes, and a hung or failed try runs once more.
        timeout-minutes: 12
        run: |
          for attempt in 1 2; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "Playwright install try $attempt failed"
          done
          exit 1

      - name: Playwright smoke
        run: npm run test:smoke

  mcp:
    name: MCP server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the C++ toolchain Clipper2 links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release CLI and in-process engine
        # lime-sim's binary solves the generated beam in mcp/sim.test.ts.
        run: cargo build -p lime-slice -p lime-mcp-engine -p lime-sim --release --locked

      - name: New engine dependencies stay MIT or Apache-2.0
        run: |
          set -euo pipefail
          cargo tree -p lime-mcp-engine --prefix none -e normal --format '{p} {l}' > /tmp/mcp-licences.txt
          if grep -Ei 'GPL|AGPL|SSPL' /tmp/mcp-licences.txt; then
            echo "a GPL-family licence is not allowed"
            exit 1
          fi
          cargo tree -p lime-sim --locked --prefix none -e normal --format '{p} {l}' > /tmp/sim-licences.txt
          if grep -Ei 'GPL|AGPL|SSPL|LGPL' /tmp/sim-licences.txt; then
            echo "a GPL-family licence is not allowed on the stress solver"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck the server
        run: npx tsc -p mcp

      - name: Schema, scenarios, export, and golden G-code
        run: |
          node --experimental-strip-types mcp/schema.test.ts
          node --experimental-strip-types mcp/scenario.test.ts
          node --experimental-strip-types mcp/model.test.ts
          node --experimental-strip-types mcp/request.test.ts
          node --experimental-strip-types mcp/numbers.test.ts
          node --experimental-strip-types mcp/render.test.ts
          node --experimental-strip-types mcp/layer-stress.test.ts
          node --experimental-strip-types mcp/sim.test.ts
          node --experimental-strip-types mcp/sim-sliced.test.ts
          node --experimental-strip-types mcp/pattern-slice.test.ts
          node --experimental-strip-types mcp/sim-reslice.test.ts
          node --experimental-strip-types mcp/sim-loop.test.ts
          node --experimental-strip-types mcp/thumb.test.ts
          node --experimental-strip-types mcp/export.test.ts
          LIME_MCP_GOLDEN=1 node --experimental-strip-types mcp/golden.test.ts
          node --experimental-strip-types mcp/native-load.test.ts
          node --experimental-strip-types mcp/stdio.test.ts
          # The installer's bundle: plain JavaScript with the engine beside it, as an install lays it out.
          npm run build:mcp
          cp target/release/liblime_mcp_engine.so src-tauri/resources/mcp/
          LIME_MCP_SERVER=src-tauri/resources/mcp/server.mjs node --experimental-strip-types mcp/stdio.test.ts
          node --experimental-strip-types mcp/part-a.test.ts
          node --experimental-strip-types mcp/batch1.test.ts
          node --experimental-strip-types mcp/batch2.test.ts
          node --experimental-strip-types src/paint-region.test.ts
          node --experimental-strip-types mcp/batch3.test.ts
          node --experimental-strip-types mcp/batch4.test.ts

  mcp-windows:
    name: MCP server (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release in-process engine
        run: cargo build -p lime-mcp-engine --release --locked

      - name: Explorer thumbnail handler
        run: |
          cargo test -p lime-preview --locked
          cargo test -p lime-shell --locked
          cargo build -p lime-shell --release --locked
          cargo build -p lime-shell --release --locked --example self-test

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

  mcp-macos:
    name: MCP server (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release in-process engine
        run: cargo build -p lime-mcp-engine --release --locked

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Load the addon and run the scenarios
        run: |
          node --experimental-strip-types mcp/native-load.test.ts
          node --experimental-strip-types mcp/scenario.test.ts
          node --experimental-strip-types mcp/stdio.test.ts

  bench:
    name: release bench smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The Model specs in test:engine need the OCCT bridge. runner.temp is not
      # available in a job-level env block.
      - name: Point at the OCCT install
        run: echo "OCCT_LIBS=${{ runner.temp }}/occt-7.9.2" >> "$GITHUB_ENV"

      # CMake and Ninja build OCCT when the cache misses.
      - name: Install the C++ toolchain Clipper2 links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake ninja-build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release CLI
        run: cargo build -p lime-slice --release --locked

      # Same cache as the rust job. A miss builds OCCT here too.
      - name: Restore the OCCT shared libraries
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Build OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 180
        run: python3 tools/occt/install.py --prefix "$OCCT_LIBS"

      - name: Save the OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      # OCCT_ROOT only for this step, so the CLI above stays the plain build.
      # The bridge lands in target/release next to lime-slice, where the engine looks.
      - name: Release OCCT bridge
        env:
          OCCT_ROOT: ${{ env.OCCT_LIBS }}
        run: |
          cargo build -p lime-model-occt --release --locked
          test -f target/release/liblime_model_occt.so

      - name: Slice bundled samples and the PA tower
        run: |
          set -euo pipefail
          mkdir -p bench-out
          bin="target/release/lime-slice"
          {
            echo "lime-slice $(git rev-parse --short HEAD)"
            for sample in samples/*; do
              if [[ "$(basename "$sample")" == "dragon_2_5.stl" ]]; then
                echo "skip ${sample}: checked-in mesh, Dragon audit is opt-in"
                continue
              fi
              echo
              echo "===== bench ${sample} ====="
              "${bin}" bench "${sample}"
            done
            echo
            echo "===== calibrate pa ====="
            "${bin}" calibrate pa -o bench-out/pa-klipper.gcode
            "${bin}" calibrate pa --firmware marlin -o bench-out/pa-marlin.gcode
          } | tee bench-out/bench.txt
          test -s bench-out/bench.txt
          test -s bench-out/pa-klipper.gcode
          test -s bench-out/pa-marlin.gcode

      - name: Upload bench output
        uses: actions/upload-artifact@v7
        with:
          name: bench-smoke
          path: bench-out/
          if-no-files-found: error

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Playwright browser version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        # A stuck apt mirror once held this step for over an hour. Each try
        # gets five minutes, and a hung or failed try runs once more.
        timeout-minutes: 12
        run: |
          for attempt in 1 2; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "Playwright install try $attempt failed"
          done
          exit 1

      - name: Frontend build
        run: npx vite build

      - name: Playwright against the release engine
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="${OCCT_LIBS}/lib:${LD_LIBRARY_PATH:-}"
          target/release/lime-slice serve --port 43218 --cache-dir "$RUNNER_TEMP/slicecache" &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:43218/api/health && break; sleep 1; done
          # The Model specs skip on an engine without a modeler. Fail here instead.
          probe=$(curl -sf http://127.0.0.1:43218/api/model/tree -H 'content-type: application/json' -d '{"call":"open","key":"ci-probe","primitive":{"primitive":"box","origin":[0,0,0],"size":[1,1,1],"turn":[0,0,0]},"chordMm":0.1}')
          echo "${probe:0:300}"
          [[ "$probe" == *'"volumeMm3"'* ]]
          curl -sf http://127.0.0.1:43218/api/model/tree -H 'content-type: application/json' -d '{"call":"close","key":"ci-probe"}' > /dev/null
          LIME_EDIT_API=http://127.0.0.1:43218 npm run test:engine

  occt-windows:
    name: OCCT dynamic link (Windows)
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      LIME_REQUIRE_OCCT: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Point at the OCCT install
        run: Add-Content -Path $env:GITHUB_ENV -Value "OCCT_ROOT=${{ runner.temp }}\occt-7.9.2"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Restore the OCCT shared libraries
        id: occt-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Build OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 300
        run: python tools/occt/install.py --prefix "$env:OCCT_ROOT"

      - name: Save the OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Test the dynamic link
        run: |
          $env:PATH = "$env:OCCT_ROOT\bin;$env:OCCT_ROOT\lib;" + $env:PATH
          cargo test -p lime-model -p lime-model-occt --locked -- --nocapture

      # The step above puts the Open CASCADE DLLs on PATH, which is why a
      # LoadLibrary that ignores the bridge's own folder still passed. This
      # step must not add that folder to PATH. The test copies the install
      # layout and strips PATH itself before loading.
      - name: Load the bridge from the bundled layout without PATH
        run: |
          cargo build -p lime-model-occt --locked
          $root = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { Join-Path $PWD "target" }
          $dll = $null
          foreach ($rel in @("debug\lime_model_occt.dll", "debug\deps\lime_model_occt.dll")) {
            $candidate = Join-Path $root $rel
            if (Test-Path -LiteralPath $candidate) { $dll = $candidate; break }
          }
          if (-not $dll) { throw "bridge dll missing under $root" }
          $env:LIME_OCCT_BRIDGE_DLL = (Resolve-Path -LiteralPath $dll).Path
          cargo test -p lime-model-load --test bundled_layout --locked -- --nocapture

      - name: STEP import regression through the loaded bridge
        run: |
          $bundle = Join-Path $PWD "target/step-occt"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item -LiteralPath "target/debug/lime_model_occt.dll" -Destination (Join-Path $bundle "lime_model_occt.dll")
          Get-ChildItem "$env:OCCT_ROOT/bin/*.dll", "$env:OCCT_ROOT/lib/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $bundle
          $env:LIME_OCCT_BRIDGE = Join-Path $bundle "lime_model_occt.dll"
          cargo test -p lime-model-load --test step_import --locked -- --nocapture

  occt-macos:
    name: OCCT dynamic link (macOS)
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      LIME_REQUIRE_OCCT: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Point at the OCCT install
        run: |
          echo "OCCT_ROOT=${{ runner.temp }}/occt-7.9.2" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=${{ runner.temp }}/occt-7.9.2/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install CMake
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          cmake --version

      - name: Restore the OCCT shared libraries
        id: occt-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Build OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 300
        run: python3 tools/occt/install.py --prefix "$OCCT_ROOT"

      - name: Save the OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Test the dynamic link
        run: cargo test -p lime-model -p lime-model-occt --locked -- --nocapture
