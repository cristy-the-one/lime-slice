# Temporary: symbolize the Delabella crash on the Windows runner and loop a newer OCCT.
# Push and pull_request on claude/w2-hole-speed only. Removed before this branch is ready.
# Does not change any existing CI job.
name: W2 hole speed loop

on:
  push:
    branches: [claude/w2-hole-speed]
  pull_request:
    branches: [main]

concurrency:
  group: w2-loop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  w2-hole-speed-loop:
    name: W2 hole speed loop (temporary)
    if: github.head_ref == 'claude/w2-hole-speed' || github.ref == 'refs/heads/claude/w2-hole-speed'
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      LIME_REQUIRE_OCCT: "1"
      CARGO_BUILD_JOBS: "4"
      W2_OCCT_JOBS: "2"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Restore OCCT 7.9.2 RelWithDebInfo
        id: occt792
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2-rwd
          key: occt-7.9.2-rwd-facelog-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/w2/build_occt.py') }}

      - name: Build OCCT 7.9.2 RelWithDebInfo with PDBs and a face log
        if: steps.occt792.outputs.cache-hit != 'true'
        timeout-minutes: 180
        run: python tools/w2/build_occt.py --prefix "${{ runner.temp }}/occt-7.9.2-rwd" --version 7.9.2 --config RelWithDebInfo --face-log

      - name: Save OCCT 7.9.2 RelWithDebInfo
        if: steps.occt792.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2-rwd
          key: occt-7.9.2-rwd-facelog-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/w2/build_occt.py') }}

      # RelWithDebInfo lands in bini/ and libi/. Release stays in bin/ and lib/. The bridge looks at bin/ and lib/.
      - name: Copy the OCCT 7.9.2 libraries to bin and lib
        shell: pwsh
        run: |
          $root = "${{ runner.temp }}/occt-7.9.2-rwd"
          foreach ($pair in @(@("bini","bin"),@("bind","bin"),@("libi","lib"),@("libd","lib"))) {
            $src = Join-Path $root $pair[0]
            $dest = Join-Path $root $pair[1]
            if (Test-Path -LiteralPath $src) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item -Path (Join-Path $src "*") -Destination $dest -Force
              Write-Host "copied $($pair[0]) -> $($pair[1])"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $root "bin\TKernel.dll"))) { throw "bin\TKernel.dll missing after copy" }
          if (-not (Test-Path -LiteralPath (Join-Path $root "bin\TKMesh.pdb"))) { throw "bin\TKMesh.pdb missing after copy" }

      - name: Build the brep test against OCCT 7.9.2 RelWithDebInfo
        timeout-minutes: 40
        env:
          OCCT_ROOT: ${{ runner.temp }}/occt-7.9.2-rwd
        run: |
          $env:PATH = "$env:OCCT_ROOT\bin;$env:OCCT_ROOT\lib;" + $env:PATH
          cargo test -p lime-model-occt --test brep --locked --no-run

      - name: Loop Delabella until a symbolized stack
        timeout-minutes: 90
        env:
          OCCT_ROOT: ${{ runner.temp }}/occt-7.9.2-rwd
        run: pwsh -File tools/w2/loop.ps1 -Phase investigate -OcctRoot "$env:OCCT_ROOT" -OutDir "${{ runner.temp }}/w2-investigate"

      - name: Restore OCCT 8.0.2 Release
        id: occt802
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/occt-8.0.2-rel
          key: occt-8.0.2-rel-facelog-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/w2/build_occt.py') }}

      - name: Build OCCT 8.0.2 Release with a face log
        if: steps.occt802.outputs.cache-hit != 'true'
        timeout-minutes: 180
        run: python tools/w2/build_occt.py --prefix "${{ runner.temp }}/occt-8.0.2-rel" --version 8.0.2 --config Release --face-log

      - name: Save OCCT 8.0.2 Release
        if: steps.occt802.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/occt-8.0.2-rel
          key: occt-8.0.2-rel-facelog-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/w2/build_occt.py') }}

      - name: Copy the OCCT 8.0.2 libraries to bin and lib
        shell: pwsh
        run: |
          $root = "${{ runner.temp }}/occt-8.0.2-rel"
          foreach ($pair in @(@("bini","bin"),@("bind","bin"),@("libi","lib"),@("libd","lib"))) {
            $src = Join-Path $root $pair[0]
            $dest = Join-Path $root $pair[1]
            if (Test-Path -LiteralPath $src) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item -Path (Join-Path $src "*") -Destination $dest -Force
              Write-Host "copied $($pair[0]) -> $($pair[1])"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $root "bin\TKernel.dll"))) { throw "bin\TKernel.dll missing after copy" }

      - name: Loop Delabella 200 times on OCCT 8.0.2
        timeout-minutes: 90
        env:
          OCCT_ROOT: ${{ runner.temp }}/occt-8.0.2-rel
        run: pwsh -File tools/w2/loop.ps1 -Phase occt802 -OcctRoot "$env:OCCT_ROOT" -OutDir "${{ runner.temp }}/w2-occt802"

      - name: Upload the loop logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w2-hole-speed-logs
          path: |
            ${{ runner.temp }}/w2-investigate
            ${{ runner.temp }}/w2-occt802
          if-no-files-found: ignore
          retention-days: 14
