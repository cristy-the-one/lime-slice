# Unsigned desktop installers. Tag pushes named v* and a manual run both
# upload a draft GitHub Release. This workflow is not the CI workflow:
# its job name must stay distinct from the required CI checks.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  installers:
    name: unsigned desktop installers (${{ matrix.label }})
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            platform: ubuntu-24.04
            target: ""
            bridge: liblime_model_occt.so
            # deb is the local Linux default; the release also builds an AppImage.
            args: --bundles deb,appimage --config src-tauri/tauri.occt.json
          - label: macos-arm
            platform: macos-latest
            target: aarch64-apple-darwin
            bridge: liblime_model_occt.dylib
            args: --target aarch64-apple-darwin --bundles dmg --config src-tauri/tauri.occt.json
          - label: macos-intel
            platform: macos-latest
            target: x86_64-apple-darwin
            bridge: liblime_model_occt.dylib
            # Cross-compiled on the Apple Silicon runner. Two dmgs, not one universal binary.
            args: --target x86_64-apple-darwin --bundles dmg --config src-tauri/tauri.occt.json
          - label: windows
            platform: windows-latest
            target: ""
            bridge: lime_model_occt.dll
            args: --bundles nsis --config src-tauri/tauri.occt.json
    env:
      # linuxdeploy on GitHub runners has no FUSE device.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      # clipper2c-sys compiles vendored Clipper2 C++ with the cc crate. It does
      # not invoke CMake. Linux links libstdc++ through .cargo/config.toml,
      # which names the GCC 13 directory shipped on ubuntu-24.04.
      - name: Install Linux webview and C++ toolchain
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            patchelf \
            file \
            wget \
            libxdo-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            cmake \
            ninja-build

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Extra Apple targets are unused on Linux and Windows.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # dtolnay/rust-toolchain@stable installs its targets input on the stable
      # channel. rust-toolchain.toml pins 1.88.0, and that is the toolchain
      # Tauri invokes, so the Intel cross target has to be added there.
      - name: Install the Intel macOS Rust target
        if: matrix.label == 'macos-intel'
        run: rustup target add x86_64-apple-darwin

      - name: Restore the OCCT shared libraries
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ matrix.label == 'macos-intel' && 'X64' || runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Build OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 120
        env:
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.label == 'macos-intel' && 'x86_64' || '' }}
        run: python tools/occt/install.py --prefix "${{ runner.temp }}/occt-7.9.2"

      - name: Save the OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ matrix.label == 'macos-intel' && 'X64' || runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Stage OCCT libraries and notices
        run: python tools/occt/stage_bundle.py --prefix "${{ runner.temp }}/occt-7.9.2" --dest src-tauri/resources/occt

      - name: Build the Open CASCADE bridge
        if: matrix.platform != 'windows-latest'
        env:
          OCCT_ROOT: ${{ runner.temp }}/occt-7.9.2
        shell: bash
        run: |
          set -euo pipefail
          target_dir="target/release"
          args=(--release)
          if [ -n "${{ matrix.target }}" ]; then
            args+=(--target "${{ matrix.target }}")
            target_dir="target/${{ matrix.target }}/release"
          fi
          if [ "${{ matrix.label }}" = "macos-intel" ]; then
            export CC_x86_64_apple_darwin="clang -arch x86_64"
            export CXX_x86_64_apple_darwin="clang++ -arch x86_64"
            export CFLAGS_x86_64_apple_darwin="-arch x86_64"
            export CXXFLAGS_x86_64_apple_darwin="-arch x86_64"
          fi
          cargo build -p lime-model-occt "${args[@]}"
          mkdir -p src-tauri/resources/occt/lib
          cp "$target_dir/${{ matrix.bridge }}" src-tauri/resources/occt/lib/

      - name: Build the Open CASCADE bridge (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $env:OCCT_ROOT = "${{ runner.temp }}\occt-7.9.2"
          cargo build -p lime-model-occt --release
          New-Item -ItemType Directory -Force -Path src-tauri/resources/occt/lib | Out-Null
          Copy-Item target\release\lime_model_occt.dll src-tauri/resources/occt/lib/

      - name: Build unsigned installers and upload the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Lime Slice ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            Unsigned desktop builds. macOS Gatekeeper and Windows SmartScreen will warn because these artifacts are not signed or notarized.
            Linux ships a .deb and an .AppImage. macOS ships one .dmg for Apple silicon and one for Intel. Windows ships an NSIS installer.
            Code signing, notarization, and the updater plugin are not configured.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          retryAttempts: 3
          args: ${{ matrix.args }}
