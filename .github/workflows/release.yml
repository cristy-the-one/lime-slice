# Unsigned desktop installers. Tag pushes named v* and a manual run both
# upload a draft GitHub Release. This workflow is not the CI workflow:
# its job name must stay distinct from the required CI checks.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # The installer jobs start together. When each one looked for the draft and
  # created it if missing, two of them could both create one, and v2.0.1's
  # installers were split across two drafts. This job creates the draft once.
  draft:
    name: draft release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      # A tag push names the tag. A manual run uses v<version> from tauri.conf.json.
      - name: Create or find the draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$REF_TAG" ]; then
            tag="$REF_TAG"
          else
            tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          fi
          prerelease=false
          [[ "$tag" == *-tandem-beta.* ]] && prerelease=true
          # The tags endpoint does not return drafts, so search the list.
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n 1)"
          if [ -z "$id" ]; then
            cat > "$RUNNER_TEMP/body.md" <<'BODY'
          Unsigned desktop builds. macOS Gatekeeper and Windows SmartScreen will warn because these artifacts are not signed or notarized.
          Linux ships a .deb and an .AppImage. macOS ships one .dmg for Apple silicon and one for Intel. Windows ships an NSIS installer.
          Code signing, notarization, and the updater plugin are not configured.
          BODY
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Lime Slice $tag" \
              -F body=@"$RUNNER_TEMP/body.md" \
              -F draft=true \
              -F prerelease="$prerelease" \
              --jq .id)"
            echo "Created draft release $id for $tag"
          else
            echo "Using existing release $id for $tag"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  installers:
    name: unsigned desktop installers (${{ matrix.label }})
    needs: draft
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            platform: ubuntu-24.04
            target: ""
            bridge: liblime_model_occt.so
            engine: liblime_mcp_engine.so
            # deb is the local Linux default; the release also builds an AppImage.
            args: --bundles deb,appimage --config src-tauri/tauri.occt.json
          # macOS is back (6.1.0): lust builds on Apple silicon. The Apple silicon dmg ships lust; the Intel one does
          # not, because lust's macOS build is proven on arm64 only and this runner is arm64 (see the lust steps).
          - label: macos-arm
            platform: macos-latest
            target: aarch64-apple-darwin
            bridge: liblime_model_occt.dylib
            engine: liblime_mcp_engine.dylib
            args: --target aarch64-apple-darwin --bundles dmg --config src-tauri/tauri.occt.json
          - label: macos-intel
            platform: macos-latest
            target: x86_64-apple-darwin
            bridge: liblime_model_occt.dylib
            engine: liblime_mcp_engine.dylib
            # Cross-compiled on the Apple Silicon runner. Two dmgs, not one universal binary.
            args: --target x86_64-apple-darwin --bundles dmg --config src-tauri/tauri.occt.json
          - label: windows
            platform: windows-latest
            target: ""
            bridge: lime_model_occt.dll
            engine: lime_mcp_engine.dll
            # tauri.crt.json ships the Visual C++ runtime beside the exe.
            # tauri.shell.json puts lime_shell.dll beside the exe and registers Explorer.
            args: --bundles nsis --config src-tauri/tauri.occt.json --config src-tauri/tauri.crt.json --config src-tauri/tauri.shell.json
    env:
      # linuxdeploy on GitHub runners has no FUSE device.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7

      # clipper2c-sys compiles vendored Clipper2 C++ with the cc crate. It does
      # not invoke CMake. Linux links libstdc++ through .cargo/config.toml,
      # which names the GCC 13 directory shipped on ubuntu-24.04.
      - name: Install Linux webview and C++ toolchain
        if: matrix.platform == 'ubuntu-24.04'
        timeout-minutes: 40
        run: |
          { echo 'Acquire::http::Timeout "30";'; echo 'Acquire::https::Timeout "30";'; echo 'Acquire::Retries "3";'; } | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            patchelf \
            file \
            wget \
            libxdo-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            cmake \
            ninja-build

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Extra Apple targets are unused on Linux and Windows.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # dtolnay/rust-toolchain@stable installs its targets input on the stable
      # channel. rust-toolchain.toml pins 1.88.0, and that is the toolchain
      # Tauri invokes, so the Intel cross target has to be added there.
      - name: Install the Intel macOS Rust target
        if: matrix.label == 'macos-intel'
        run: rustup target add x86_64-apple-darwin

      - name: Restore the OCCT shared libraries
        id: occt-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ matrix.label == 'macos-intel' && 'X64' || runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      - name: Build OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 120
        env:
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.label == 'macos-intel' && 'x86_64' || '' }}
        run: python tools/occt/install.py --prefix "${{ runner.temp }}/occt-7.9.2"

      - name: Save the OCCT shared libraries
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/occt-7.9.2
          key: occt-7.9.2-model-${{ runner.os }}-${{ matrix.label == 'macos-intel' && 'X64' || runner.arch }}-${{ hashFiles('tools/occt/install.py') }}

      # stage_bundle.py gives the Linux libraries runpath $ORIGIN. They depend
      # on each other by soname, and linuxdeploy's ldd does not search a
      # neighbour that has an empty runpath, so the AppImage step fails.
      - name: Stage OCCT libraries and notices
        run: python tools/occt/stage_bundle.py --prefix "${{ runner.temp }}/occt-7.9.2" --dest src-tauri/resources/occt

      - name: Build the Open CASCADE bridge
        if: matrix.platform != 'windows-latest'
        env:
          OCCT_ROOT: ${{ runner.temp }}/occt-7.9.2
        shell: bash
        run: |
          set -euo pipefail
          target_dir="target/release"
          args=(--release)
          if [ -n "${{ matrix.target }}" ]; then
            args+=(--target "${{ matrix.target }}")
            target_dir="target/${{ matrix.target }}/release"
          fi
          if [ "${{ matrix.label }}" = "macos-intel" ]; then
            export CC_x86_64_apple_darwin="clang -arch x86_64"
            export CXX_x86_64_apple_darwin="clang++ -arch x86_64"
            export CFLAGS_x86_64_apple_darwin="-arch x86_64"
            export CXXFLAGS_x86_64_apple_darwin="-arch x86_64"
          fi
          cargo build -p lime-model-occt "${args[@]}"
          mkdir -p src-tauri/resources/occt/lib
          cp "$target_dir/${{ matrix.bridge }}" src-tauri/resources/occt/lib/
          # The MCP server's engine ships beside its bundle, in resources/mcp.
          cargo build -p lime-mcp-engine "${args[@]}"
          mkdir -p src-tauri/resources/mcp
          cp "$target_dir/${{ matrix.engine }}" src-tauri/resources/mcp/

      - name: Build the Open CASCADE bridge (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $env:OCCT_ROOT = "${{ runner.temp }}\occt-7.9.2"
          cargo build -p lime-model-occt --release
          New-Item -ItemType Directory -Force -Path src-tauri/resources/occt/lib | Out-Null
          Copy-Item target\release\lime_model_occt.dll src-tauri/resources/occt/lib/
          # The MCP server's engine ships beside its bundle, in resources/mcp.
          cargo build -p lime-mcp-engine --release
          New-Item -ItemType Directory -Force -Path src-tauri/resources/mcp | Out-Null
          Copy-Item target\release\lime_mcp_engine.dll src-tauri/resources/mcp/
      - name: Build the Explorer thumbnail handler
        if: matrix.platform == 'windows-latest' && !(github.ref_type == 'tag' && contains(github.ref_name, '-tandem-beta.'))
        shell: pwsh
        run: |
          # Explorer's thumbnail handler. The production installer copies it to $INSTDIR.
          cargo build -p lime-shell --release
          Copy-Item target\release\lime_shell.dll src-tauri/resources/lime_shell.dll

      # The installer carries the MCP server as plain JavaScript for the user's own
      # Node 22.6+, so Claude's config can point at the install instead of a checkout.
      - name: Bundle the MCP server
        run: npm run build:mcp

      - name: Isolate Tandem beta data
        if: github.ref_type == 'tag' && contains(github.ref_name, '-tandem-beta.')
        shell: bash
        run: touch src-tauri/resources/mcp/tandem-beta.identity

      # The release's own server mirrors into the release app once the person turns its Tandem light on: it reads that
      # app's bridge token file (com.limeslice.slicer, port 43119), as the beta's reads only the beta's
      # (mcp/bridge-client.ts). A checkout's server and an unmarked bundle read none.
      - name: Mark the release's MCP server
        if: "!(github.ref_type == 'tag' && contains(github.ref_name, '-tandem-beta.'))"
        shell: bash
        run: touch src-tauri/resources/mcp/stable.identity

      # recipe_run builds recipes with lust (tools/lust/LUST_REV) and its tinycc. They ship in mcp/lust beside
      # server.mjs, which finds them there (mcp/recipe.ts findLust). The Intel dmg carries none: this runner is
      # arm64, so its lust would be too, and lust's macOS build is proven on arm64 only. recipe_run answers
      # "Recipes need lust" there.
      # build-tcc.sh needs bash 5 and the GNU userland, as in lust-lang's macos-arm64 job.
      - name: Install bash 5 and GNU userland (macOS)
        if: matrix.label == 'macos-arm'
        run: brew install bash coreutils findutils gnu-sed

      - name: Cache lust
        if: matrix.label != 'macos-intel'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/lust
          key: lust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/lust/LUST_REV', 'tools/lust/install.sh') }}

      # zig for lust's optimised recipe builds (`--opt=bg`, zig cc): the official release for this runner, checked
      # against tools/lust/ZIG_SHA256, staged trimmed in mcp/lust/zig by stage.sh.
      - name: Cache zig
        if: matrix.label != 'macos-intel'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/lust/ZIG_VERSION', 'tools/lust/ZIG_SHA256') }}

      # On Windows install.sh loads the Visual Studio developer environment itself (tools/lust/msvc-env.sh).
      - name: Build lust and stage it beside the MCP server
        if: matrix.label != 'macos-intel'
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          tools/lust/install.sh "$RUNNER_TEMP/lust" > /dev/null
          zig=$(tools/lust/zig.sh "$RUNNER_TEMP/zig" | tail -n 1)
          tools/lust/stage.sh "$RUNNER_TEMP/lust" src-tauri/resources/mcp/lust "$zig"

      # A recipe built and run by the staged copy, with the bundled server's engine; then the same with the staged
      # zig, every build lust's optimised one (LIME_LUST_OPT=now), and the background build landing (recipe-opt).
      - name: Run recipes with the staged lust
        if: matrix.label != 'macos-intel'
        timeout-minutes: 20
        shell: bash
        env:
          LIME_RECIPE_REQUIRED: "1"
        run: |
          set -euo pipefail
          exe=""
          [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          export LIME_LUST="$PWD/src-tauri/resources/mcp/lust/bin/lust$exe"
          LIME_LUST_OPT=0 node --experimental-strip-types mcp/recipe.test.ts
          test -x "src-tauri/resources/mcp/lust/zig/zig$exe"
          LIME_LUST_OPT=now node --experimental-strip-types mcp/recipe.test.ts
          LIME_ZIG="$PWD/src-tauri/resources/mcp/lust/zig/zig$exe" LIME_LUST_OPT_CACHE="$RUNNER_TEMP/lime-opt-cache" node --experimental-strip-types mcp/recipe-opt.test.ts
          du -sh src-tauri/resources/mcp/lust src-tauri/resources/mcp/lust/zig

      # Without these a Windows install that lacks the VC++ Redistributable
      # stops at start with "MSVCP140.dll was not found".
      - name: Stage the Visual C++ runtime (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        # The MCP engine links the same runtime and is loaded by the user's node, which looks beside the
        # engine (mcp\), not beside the app's exe; the Open CASCADE DLLs then find the runtime already loaded.
        run: |
          ./tools/windows/stage_crt.ps1 -Dest src-tauri/resources/crt
          ./tools/windows/stage_crt.ps1 -Dest src-tauri/resources/mcp

      - name: Choose installer identity
        id: installer-identity
        shell: bash
        env:
          BASE_ARGS: ${{ matrix.args }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          args="$BASE_ARGS"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" == *-tandem-beta.* ]]; then
            # Do not install the production Explorer extension for an experimental build.
            args="${args/--config src-tauri\/tauri.shell.json/} --config src-tauri/tauri.tandem-beta.json"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Build unsigned installers and upload them to the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The draft job created the release, so this job only uploads to it.
          releaseId: ${{ needs.draft.outputs.id }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          retryAttempts: 3
          args: ${{ steps.installer-identity.outputs.args }}

      # Recipes need the bundled lust and its tcc to stay executable inside the .deb.
      - name: Check lust in the .deb
        if: matrix.label == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(ls target/release/bundle/deb/*.deb | head -n 1)
          listing=$(dpkg-deb -c "$deb")
          for f in mcp/lust/bin/lust mcp/lust/bin/lust-core mcp/lust/lib/lust/tcc/bin/tcc mcp/lust/zig/zig; do
            grep -qE "^-rwxr-xr-x .*/$f\$" <<< "$listing" || { echo "$f is missing or not executable in $deb"; exit 1; }
          done
          # Here-strings, not `echo | grep -q`: grep -q stops reading early, echo then fails with a broken pipe, and
          # pipefail turns that into a false "missing" (the v4.8.0 release run).
          grep -q "mcp/lust/COPYING-tinycc" <<< "$listing" || { echo "tinycc's licence is missing in $deb"; exit 1; }
          grep -q "mcp/lust/LICENSE-zig" <<< "$listing" || { echo "zig's licence is missing in $deb"; exit 1; }
          grep -q "mcp/lust/zig/lib/libc/glibc/LICENSES" <<< "$listing" || { echo "glibc's licences are missing in $deb"; exit 1; }
          grep -q libc6-dev <<< "$(dpkg-deb -f "$deb" Depends)" || { echo "$deb does not depend on libc6-dev"; exit 1; }
