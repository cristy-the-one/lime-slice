[workspace]
resolver = "2"
members = [
    "crates/lime-slice-core",
    "crates/lime-slice",
    "crates/lime-model",
    "crates/lime-model-occt",
    "crates/lime-model-load",
    "crates/lime-mcp-engine",
    "crates/lime-preview",
    "crates/lime-shell",
    "src-tauri",
]

[workspace.package]
version = "3.5.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.88.0"

[profile.release]
lto = "thin"
codegen-units = 1

# The slicer is float and geometry code. The slice_cube and solid_infill_speed
# tests alone took three minutes unoptimised. opt-level 2 keeps `cargo test
# -p lime-slice-core` fast. Optimisation does not change float results.
[profile.test.package.lime-slice-core]
opt-level = 2
