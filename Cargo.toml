[workspace]
resolver = "2"
members = [
    "crates/lime-slice-core",
    "crates/lime-slice",
    "crates/lime-model",
    "crates/lime-model-occt",
    "crates/lime-model-load",
    "crates/lime-recipe",
    "crates/lime-recipe-runner",
    "crates/lime-mcp-engine",
    "crates/lime-preview",
    "crates/lime-shell",
    "crates/lime-sim",
    "crates/lime-sim-bridge",
    "src-tauri",
]

[workspace.package]
version = "6.5.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.88.0"

# Every crate takes serde_json from here. `float_roundtrip` makes it read a
# decimal number to the nearest f64, as JSON.parse, Rust's `str::parse` and
# lime-recipe do. Without it, about one number in eight comes back one unit off
# in the last place (11.005321081608713 read as 11.005321081608711), so a lust
# plugin's calls differed with the engine's native geometry on and off.
[workspace.dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = "thin"
codegen-units = 1

# The sparse factor is generic and monomorphised into lime-sim. opt-level 2
# is what keeps `cargo test -p lime-sim` under a minute. Coarse and middle
# Kirsch rows stay in this run.
[profile.test.package.lime-sim]
opt-level = 2

# The slicer is float and geometry code. The slice_cube and solid_infill_speed
# tests alone took three minutes unoptimised. opt-level 2 keeps `cargo test
# -p lime-slice-core` fast. Optimisation does not change float results.
[profile.test.package.lime-slice-core]
opt-level = 2
