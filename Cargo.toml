[workspace]
resolver = "2"
members = [
    "crates/lime-slice-core",
    "crates/lime-slice",
    "crates/lime-model",
    "src-tauri",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.88.0"

[profile.release]
lto = "thin"
codegen-units = 1
