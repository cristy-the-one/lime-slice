[workspace]
resolver = "2"
members = [
    "crates/lime-slice-core",
    "crates/lime-slice",
    "crates/lime-model",
    "crates/lime-model-occt",
    "crates/lime-model-load",
    "crates/lime-mcp-engine",
    "crates/lime-preview",
    "crates/lime-shell",
    "src-tauri",
]

[workspace.package]
version = "2.7.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.88.0"

[profile.release]
lto = "thin"
codegen-units = 1
